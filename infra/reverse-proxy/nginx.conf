pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # WebSocket upgrade hop-by-hop header mapping.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format rp_log '$remote_addr - $time_local '
                      '"$request" $status '
                      '"$http_user_agent"';

    access_log /var/log/nginx/access.log rp_log;
    error_log  /var/log/nginx/error.log  warn;

    # Choke point: the only ingress reachable from concordia-public.
    # Terminates TLS from clients, then re-encrypts to the WAF upstream
    # so every hop in the chain stays encrypted (defense in depth).
    server {
        listen 8443 ssl;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass         https://waf:8443;
            proxy_ssl_verify   off;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
