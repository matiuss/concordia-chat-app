pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # ── Load balancing algorithm ───────────────────────────────────────
    # Three algorithms required by the horizontal-scaling experiment.
    # Uncomment ONE directive inside the upstream block to switch
    # strategies; everything else stays identical so the comparison is
    # apples-to-apples.
    #
    #   • Round Robin     → default, no directive needed
    #   • Least Conn.     → uncomment `least_conn;`
    #   • IP Hash         → uncomment `ip_hash;`
    upstream chat_replicas {
        # least_conn;
        # ip_hash;

        server chat-1:8083 max_fails=3 fail_timeout=10s;
        server chat-2:8083 max_fails=3 fail_timeout=10s;
        server chat-3:8083 max_fails=3 fail_timeout=10s;
    }

    # $upstream_addr lets us log (and surface as a header) which replica
    # actually served the request — direct visual proof of the
    # distribution effect.
    log_format lb_log '$remote_addr -> $upstream_addr - $time_local '
                      '"$request" $status';
    access_log /var/log/nginx/access.log lb_log;
    error_log  /var/log/nginx/error.log  warn;

    server {
        listen 8083;

        # Surface the upstream IP that answered so external callers can
        # see distribution even without reading the chat replica's own
        # X-Instance-Id header.
        add_header X-Upstream $upstream_addr always;

        # The LB has its own /health so the gateway / operators can probe
        # the LB layer independently of the replicas.
        location = /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","role":"chat-lb"}\n';
        }

        location / {
            proxy_pass http://chat_replicas;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Keep idle connections alive long enough for chat polling
            # but short enough to release dead replicas quickly.
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }
    }
}
